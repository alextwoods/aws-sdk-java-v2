# Shared jqwik configuration for property-based tests. jqwik 1.6+ reads its settings from
# junit-platform.properties (keys prefixed with "jqwik."); a jqwik.properties file is no longer read.
# Only jqwik keys belong here, so modules that do not use jqwik are unaffected.

# Report every property run (not only failures). Each report includes the seed.
jqwik.reporting.onlyfailures=false
# Print reports to stdout, which Surefire captures in the console and test report. Surefire does not render
# JUnit Platform report entries, so "true" here would hide the seed and the shrunk sample.
jqwik.reporting.usejunitplatform=false
# After a failure, rerun the previously failing (shrunk) sample first, then continue with random generation.
jqwik.failures.after.default=SAMPLE_FIRST
