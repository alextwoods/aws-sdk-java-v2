# Racecar decisions (design D.6, Requirement 37.1): one entry per racecar phase.
#
# scripts/schema-serde/racecar_decisions.py writes racecar-decisions.md from this file, and its --check mode (run by
# RacecarDecisionTableTest in test/architecture-tests) fails when the Markdown is out of date or an entry is invalid.
#
# Format: a YAML subset that the script reads without a YAML library. Each entry starts with "- id: ..."; each further
# key is indented by two spaces. Every value is on one line and is a JSON literal (a double-quoted string, an integer
# or a list of strings), which is also valid YAML.
#
# Keys:
#   id                required  racecar phase id, as in D.6
#   optimization      required  what racecar did
#   decision          required  one of "Applied (re-implemented here)", "Superseded",
#                               "Deferred (later individual optimization)", "Rejected"
#   component         required  the SDK component, or the mechanism that replaces racecar's ("—" when Rejected)
#   reason            required
#   classes           Applied and Superseded only, required there: fully qualified runtime classes named by the
#                     component; RacecarDecisionTableTest loads each one
#   applied_in_phase  Applied only, required there: the design phase that applied it (2 = with the new path's core)
#   ab_record         path, relative to this directory, of the paired A/B record (task 9.19); required for a row
#                     applied in phase 5, allowed on any row whose decision an experiment decided
#   task              optional: the task that implemented it, or the task that will try it
#   d6_decision       optional: the D.6 table's decision, when the implementation changed it (needs a note)
#   note              optional: where the implementation differs from the D.6 table

