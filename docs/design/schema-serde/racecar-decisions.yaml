- id: "A"
  optimization: "Materialized-body zero-copy contract (`ContentStreamProvider.contentAsByteBufferOrNull`, wrapper propagation, Apache5 `ByteArrayEntity`, `SimpleHttpContentPublisher`)"
  decision: "Applied (re-implemented here)"
  component: "Codec `ByteBufferOutputStream.toContentStreamProvider()` → `ContentStreamProvider.contentAsByteBufferOrNull()` → `SdkHttpClientTransport` (body passed unwrapped) and `SdkAsyncHttpClientTransport` (`SimpleHttpContentPublisher`); `Apache5HttpRequestFactory` sends the buffer as a `ByteArrayEntity`"
  reason: "Requirement 13.6"
  classes: ["software.amazon.awssdk.codecs.commons.ByteBufferOutputStream", "software.amazon.awssdk.http.ContentStreamProvider", "software.amazon.awssdk.core.internal.http.transport.SdkHttpClientTransport", "software.amazon.awssdk.core.internal.http.transport.SdkAsyncHttpClientTransport", "software.amazon.awssdk.core.internal.http.async.SimpleHttpContentPublisher", "software.amazon.awssdk.http.apache5.internal.impl.Apache5HttpRequestFactory"]
  applied_in_phase: 2
  task: "3.4, 3.17"

- id: "E1"
  optimization: "Marshall buffer sized from history (`MarshallBufferSizeHints`)"
  decision: "Applied (re-implemented here)"
  component: "`HttpClientProtocol.newRequestBodyBuffer`/`finishRequestBody`, backed by `MarshallBufferSizeTracker`: per protocol instance, an identity hash table of operations with a parallel `int[]` of size hints for `ByteBufferOutputStream`"
  reason: "−42% batch-put allocation in racecar"
  classes: ["software.amazon.awssdk.protocols.client.http.HttpClientProtocol", "software.amazon.awssdk.protocols.client.http.internal.MarshallBufferSizeTracker"]
  applied_in_phase: 2
  task: "3.19"
  note: "D.6 indexes the `int[]` by operation ordinal. `ApiOperation` has no ordinal, so each protocol instance assigns slots in an identity hash table (task 3.19). awsQuery and ec2Query size their form body from a tracker of their own (`QueryClientProtocol`, the capacity the last body needed, FU-4). A recorded size of 0 is an empty-body marker: HTTP binding operations whose last request wrote no codec body get no buffer (fix/marshall-allocation)"

