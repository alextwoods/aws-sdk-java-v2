# smithy-java version. Pinned to the same version the parent SDK build uses
# (root pom <smithy.java.version>), so the native smithy-java benchmark arm and the
# bridged v2 client run on identical runtime code and the comparison isolates the bridge.
smithyJavaVersion=1.6.1
# AWS DynamoDB Smithy model, published from https://github.com/aws/api-models-aws
dynamodbModelVersion=1.0.12
